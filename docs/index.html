<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilseon | Minimalist ADHD Task Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        // Setting Inter as the default sans font
                        sans: ['Inter', 'ui-sans-serif', 'system-ui'],
                    },
                    colors: {
                        teal: {
                            brand: '#5A9B80',
                            dark: '#487d67',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #5A9B80; border-radius: 10px; }
        body { background-color: #0f172a; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const IlseonLanding = () => {
        return (
            <div className="min-h-screen text-slate-200 selection:bg-teal-brand/30">

                    <div className="inline-block px-4 py-1.5 mb-6 text-xs font-bold tracking-widest text-teal-brand uppercase bg-teal-brand/10 rounded-full border border-teal-brand/20">

                    <div className="flex flex-col sm:flex-row items-center justify-center gap-4 mb-20">
                        <a href="#" className="w-full sm:w-auto px-8 py-4 bg-teal-brand hover:bg-teal-dark text-slate-900 font-bold rounded-xl transition-all transform hover:scale-105 shadow-lg shadow-teal-brand/20">

                        </a>
                        <a href="https://github.com/cladam/ilseon" target="_blank" className="w-full sm:w-auto px-8 py-4 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl transition-all border border-slate-700">

                            <ul className="space-y-4">
                                {[
                                    "Visual progress without the pressure.",

                                        </div>
                                        {text}
                                    </li>
                                ))}
                            </ul>

                    </p>

            </div>

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<IlseonLanding />);
</script>
</body>
</html>
